<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e0d0f" media="(prefers-color-scheme: dark)">
<title>Send an email to Chloe Clarke</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f5f2; --ink: #111012; --muted: #77727a; --soft: #efece8;
    --card: #ffffff; --card-border: rgba(17,16,18,.07);
    --red: #d3122f; --blob-1: #ff8fa3; --blob-2: #c9b8ff; --blob-3: #ffd2b8;
    --chip: rgba(255,255,255,.82); --chip-border: rgba(17,16,18,.06);
    --shadow: 0 1px 2px rgba(17,16,18,.04), 0 12px 24px -8px rgba(17,16,18,.10), 0 40px 80px -24px rgba(120,40,70,.18);
    --ok: #158a4c; --err: #d3122f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e0d0f; --ink: #f4f1ee; --muted: #9b95a0; --soft: #1d1b20;
      --card: #161418; --card-border: rgba(255,255,255,.08);
      --red: #ff4d66; --blob-1: #8a1a35; --blob-2: #3b2a7a; --blob-3: #5a2a1a;
      --chip: rgba(30,28,33,.8); --chip-border: rgba(255,255,255,.08);
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 24px 60px -20px rgba(0,0,0,.6);
      --ok: #5fd896; --err: #ff6b7f;
    }
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  html, body { margin: 0; }
  body {
    color: var(--ink); background: var(--bg);
    font: 16px/1.5 "Inter Tight", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100dvh; padding: max(18px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    display: flex; justify-content: center; align-items: flex-start; overflow-x: hidden;
  }
  .wrap { width: 100%; max-width: 480px; display: flex; flex-direction: column; align-items: center; position: relative; }


  /* ---------- headline ---------- */
  h1 {
    margin: 14px 0 0; text-align: center; font-weight: 600; letter-spacing: -.045em; line-height: .98;
    font-size: clamp(2.2rem, 10.5vw, 3.4rem);
  }
  h1 .l { display: block; white-space: nowrap; animation: in .9s cubic-bezier(.2,.8,.2,1) both; }
  h1 .l2 { animation-delay: .12s; }
  h1 .l3 { animation-delay: .24s; }
  h1 #rot { display: inline-block; color: var(--muted); font-weight: 500; transition: opacity .38s ease, filter .38s ease, transform .38s ease; }
  h1 #rot.out { opacity: 0; filter: blur(8px); transform: translateY(.2em); }
  h1 em {
    font-family: "Instrument Serif", Georgia, serif; font-style: italic; font-weight: 400; letter-spacing: -.02em;
    font-size: 1.18em; line-height: .9; padding-right: .06em;
    background: linear-gradient(100deg, var(--red) 0%, #ff5a7a 50%, #9b5cff 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  @keyframes in { from { opacity: 0; transform: translateY(14px); filter: blur(6px); } }

  /* ---------- photo stage ---------- */
  .stage { position: relative; width: 100%; display: flex; justify-content: center; margin-top: 10px; }
  .blob { position: absolute; inset: 12% 4% 6%; border-radius: 50%; filter: blur(48px); opacity: .75; z-index: 0;
    background: radial-gradient(40% 45% at 30% 40%, var(--blob-1), transparent 70%),
                radial-gradient(45% 45% at 72% 35%, var(--blob-2), transparent 70%),
                radial-gradient(50% 40% at 50% 80%, var(--blob-3), transparent 70%);
    animation: drift 12s ease-in-out infinite alternate; }
  @keyframes drift { to { transform: translate(4%, -3%) scale(1.06) rotate(8deg); } }

  /* photo is two slices: the top ends exactly at the frame's edge, the hand slice overlaps the frame */
  .hero { position: relative; z-index: 1; width: min(72%, 300px);
    margin-bottom: calc(-1 * min(72%, 300px) * 61 / 422); animation: in 1s .3s cubic-bezier(.2,.8,.2,1) both; }
  .hero img { display: block; width: 100%; height: auto; }

  /* floating UI chips */
  .chip {
    position: absolute; z-index: 2; display: flex; align-items: center; gap: 8px;
    padding: 8px 12px 8px 8px; border-radius: 14px; font-size: .78rem; line-height: 1.2; white-space: nowrap;
    background: var(--chip); border: 1px solid var(--chip-border); box-shadow: 0 10px 30px -10px rgba(17,16,18,.25);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    animation: in .9s cubic-bezier(.2,.8,.2,1) both, float 6s ease-in-out infinite;
  }
  .chip b { display: block; font-weight: 600; }
  .chip span.t { color: var(--muted); }
  .chip .ic { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; font-size: .9rem; flex: none; }
  .chip.c1 { left: 0; top: 40%; animation-delay: .7s, 0s; }
  .chip.c1 .ic { background: rgba(255,90,122,.16); }
  .chip.c2 { right: 0; top: 66%; animation-delay: .9s, -3s; }
  .chip.c2 .ic { background: rgba(155,92,255,.16); color: var(--ink); }
  @keyframes float { 50% { transform: translateY(-8px); } }

  /* ---------- form card ---------- */
  main {
    position: relative; width: 100%; background: var(--card); border: 1px solid var(--card-border);
    border-radius: 28px; padding: 26px 18px 18px; box-shadow: var(--shadow);
  }
  .field + .field { margin-top: 14px; }
  label { display: block; margin: 0 0 7px 4px; font-size: .85rem; font-weight: 500; color: var(--muted); }
  input, textarea {
    width: 100%; font: inherit; font-size: 16px; /* 16px stops iOS zoom on focus */
    color: var(--ink); background: var(--soft); border: 1px solid transparent; border-radius: 16px; padding: 14px 16px;
    transition: background .2s ease, border-color .2s ease, box-shadow .2s ease;
  }
  input::placeholder, textarea::placeholder { color: var(--muted); opacity: .8; }
  textarea { min-height: 160px; resize: vertical; }
  input:focus, textarea:focus { outline: none; background: var(--card); border-color: color-mix(in srgb, var(--red) 55%, transparent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--red) 14%, transparent); }
  button {
    position: relative; overflow: hidden; width: 100%; margin-top: 20px; min-height: 58px; border: 0; border-radius: 999px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    background: var(--ink); color: var(--bg); font: 600 1.05rem/1 "Inter Tight", sans-serif; letter-spacing: -.01em;
    box-shadow: 0 10px 24px -10px rgba(17,16,18,.5), inset 0 1px 0 rgba(255,255,255,.15);
    transition: transform .15s ease;
  }
  button::after { /* shine sweep */
    content: ""; position: absolute; inset: 0; transform: translateX(-120%);
    background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.22) 50%, transparent 70%);
    animation: shine 4.5s 1.5s ease-in-out infinite;
  }
  @keyframes shine { 0%, 60% { transform: translateX(-120%); } 100% { transform: translateX(120%); } }
  button .arrow { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--red); color: #fff; font-size: .9rem; transition: transform .25s cubic-bezier(.2,.8,.2,1); }
  button:hover .arrow, button:focus-visible .arrow { transform: translateX(3px) rotate(-30deg); }
  button:active { transform: scale(.985); }
  button:focus-visible { outline: 2px solid var(--red); outline-offset: 3px; }
  button:disabled { opacity: .6; cursor: default; }
  .hp { position: absolute; left: -9999px; }
  #status { margin: 12px 0 0; min-height: 1.5em; font-size: .95rem; font-weight: 500; text-align: center; }
  #status.ok { color: var(--ok); }
  #status.err { color: var(--err); }

  /* ---------- marquee ---------- */
  .marquee { width: calc(100% + 32px); margin-top: 26px; overflow: hidden;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 15%, #000 85%, transparent); mask-image: linear-gradient(90deg, transparent, #000 15%, #000 85%, transparent); }
  .marquee .track { display: flex; width: max-content; animation: scroll 26s linear infinite; }
  .marquee span { padding: 0 14px; font-family: "Instrument Serif", Georgia, serif; font-style: italic; font-size: 1.5rem; color: var(--muted); white-space: nowrap; }
  .marquee span i { font-style: normal; color: var(--red); font-size: .9rem; vertical-align: .2em; margin-left: 14px; }
  @keyframes scroll { to { transform: translateX(-50%); } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">
<h1>
  <span class="l l1">Send <span id="rot">an email</span></span>
  <span class="l l2">to <em>Chloe Clarke</em></span>
</h1>

<div class="stage">
  <div class="blob" aria-hidden="true"></div>
  <div class="hero">
    <img src="chloe-top.png" alt="Chloe Clarke" width="422" height="587">
    <img src="chloe-hand.png" alt="" width="422" height="61">
  </div>
  <div class="chip c1" aria-hidden="true"><span class="ic">💌</span><span><b>New fan mail</b><span class="t">just now</span></span></div>
  <div class="chip c2" aria-hidden="true"><span class="ic">↩︎</span><span><b>Replies go to you</b><span class="t">straight to your inbox</span></span></div>
</div>

<main>
  <form id="form" novalidate>
    <div class="field">
      <label for="email">Your email address</label>
      <input id="email" name="email" type="email" inputmode="email" autocomplete="email" required placeholder="you@example.com">
    </div>
    <div class="field">
      <label for="subject">Subject</label>
      <input id="subject" name="_subject" type="text" autocomplete="off" required placeholder="What's it about?">
    </div>
    <div class="field">
      <label for="message">Message</label>
      <textarea id="message" name="message" required placeholder="Write your message…"></textarea>
    </div>

    <!-- spam trap: real people never fill this in -->
    <input class="hp" type="text" name="_honey" tabindex="-1" autocomplete="off" aria-hidden="true">

    <button id="send" type="submit"><span class="label">Send</span><span class="arrow" aria-hidden="true">→</span></button>
    <p id="status" role="status" aria-live="polite"></p>
  </form>
</main>

<div class="marquee" aria-hidden="true"><div class="track"><span>love letters<i>✦</i></span><span>fan mail<i>✦</i></span><span>thank-yous<i>✦</i></span><span>hellos<i>✦</i></span><span>big news<i>✦</i></span><span>compliments<i>✦</i></span><span>love letters<i>✦</i></span><span>fan mail<i>✦</i></span><span>thank-yous<i>✦</i></span><span>hellos<i>✦</i></span><span>big news<i>✦</i></span><span>compliments<i>✦</i></span></div></div>
</div>

<script>
  // ===== CONFIG: put the recipient's email address here (the only place it is set) =====
  const RECIPIENT = "CHLOE_EMAIL_HERE@example.com";
  // =====================================================================================

  const form = document.getElementById("form");
  const btn = document.getElementById("send");
  const statusEl = document.getElementById("status");

  function setStatus(text, kind) {
    statusEl.textContent = text;
    statusEl.className = kind || "";
  }

  // rotating word in the title: "Send [an email] to"
  const words = ["an email", "a love letter", "fan mail", "a hello", "a thank-you"];
  const rot = document.getElementById("rot");
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (rot && !reduce) {
    let i = 0;
    setInterval(() => {
      rot.classList.add("out");
      setTimeout(() => {
        i = (i + 1) % words.length;
        rot.textContent = words[i];
        rot.classList.remove("out");
      }, 380);
    }, 2800);
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!form.checkValidity()) {
      form.reportValidity();
      return;
    }
    btn.disabled = true;
    btn.querySelector(".label").textContent = "Sending…";
    setStatus("");

    const data = Object.fromEntries(new FormData(form));
    data._replyto = data.email;        // replying in Chloe's inbox goes to the sender
    data._template = "box";
    data._captcha = "false";

    try {
      const res = await fetch("https://formsubmit.co/ajax/" + encodeURIComponent(RECIPIENT), {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify(data)
      });
      const json = await res.json().catch(() => ({}));
      if (!res.ok || json.success === false || json.success === "false") {
        throw new Error(json.message || "Request failed");
      }
      form.reset();
      setStatus("Sent! Thanks for your message.", "ok");
    } catch (err) {
      setStatus("Couldn't send right now. Please try again in a moment.", "err");
    } finally {
      btn.disabled = false;
      btn.querySelector(".label").textContent = "Send";
    }
  });
</script>
</body>
</html>
